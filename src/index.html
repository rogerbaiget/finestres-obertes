<!DOCTYPE html>
<html lang="ca">
<head>
<script>
// Apply the theme before the page paints, to avoid a flash of the default theme
(function(){
  var t = localStorage.getItem('theme') || (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  if(t==='light') document.documentElement.classList.add('light');

  // Preload the CARTO basemap style.json matching this theme, in parallel with
  // app.js downloading. app.js can't request it until the whole bundle has
  // downloaded, parsed, and started executing (~2.8s, per PERFORMANCE.md) —
  // without this hint the browser doesn't even start that fetch until then.
  // Runs as the very first thing in <head> so the browser discovers it before
  // any other request on the page. URLs duplicated from carto-style.js's
  // loadCartoStyle() rather than imported: this script must stay a plain
  // synchronous inline script, running before any module script, to apply the
  // theme class before first paint.
  var styleUrl = t === 'light'
    ? 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json'
    : 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json';
  var preload = document.createElement('link');
  preload.rel = 'preload';
  preload.as = 'fetch';
  preload.crossOrigin = 'anonymous';
  preload.href = styleUrl;
  document.head.appendChild(preload);
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finestres obertes — Càmeres dels Països Catalans</title>
<meta name="description" content="Mapa en directe de càmeres web dels Països Catalans: Catalunya, el País Valencià, les Illes Balears, Andorra i l'Alguer, amb vídeo i última captura.">
<!-- Non-blocking (media=print trick, same as the Google Fonts link below): MapLibre's
     controls/popups are DOM nodes MapLibre itself creates via JS, so they can't exist
     before app.js runs anyway — by which time this small (10KB), early-requested file
     has had far longer to arrive than app.js's own 265KB bundle. Measured no visible
     flash of unstyled controls before keeping this; see PERFORMANCE.md. -->
<link rel="stylesheet" href="maplibre-gl.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="maplibre-gl.css"></noscript>
<!-- EXPERIMENT: fonts.googleapis.com preconnect removed to test whether PageSpeed
     Insights' "more than 4 preconnects" finding was double-counting this single tag
     (once as head>link, once reformatted as an HTTP Link-header string) rather than
     a real second hint. See PERFORMANCE.md before making this permanent either way. -->
<!-- crossorigin is required here (unlike the fonts.googleapis.com preconnect above):
     loadCartoStyle() fetches style.json via fetch(), which uses CORS mode, opening a
     different kind of connection than a plain preconnect — without this attribute
     the browser opens a second connection anyway and the preconnect goes unused. -->
<link rel="preconnect" href="https://basemaps.cartocdn.com" crossorigin>
<!-- Both also fetched cross-origin (MapLibre's own tile/font/sprite loading, and
     load.js's fetch() to the Worker), so both need crossorigin for the same reason. -->
<link rel="preconnect" href="https://tiles.basemaps.cartocdn.com" crossorigin>
<link rel="preconnect" href="https://finestres-obertes-cameras-api.roger-baiget.workers.dev" crossorigin>
<!-- display=swap (not block): the H1 is our LCP element and uses Fraunces — block
     kept it invisible until the font arrived, and under real network contention
     with app.js/map tiles that font request doesn't even start for ~3s. swap
     paints the fallback font immediately and swaps in Fraunces when it's ready,
     decoupling LCP from font-load time. Confirmed via network-requests timestamps
     and the font-display-insight/lcp-breakdown-insight audits — see PERFORMANCE.md. -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="styles.css">
<!-- Without these, the browser only discovers each of app.js's imports after
     fetching+parsing its parent (app.js itself, then cameras/index.js), turning a
     flat set of small first-party modules into a multi-level chain — confirmed via
     Lighthouse's network-dependency-tree as the single longest chain on the page.
     Preloading lets them all start fetching in parallel with app.js instead. -->
<link rel="modulepreload" href="js/data/andorra-catalonia-border.js">
<link rel="modulepreload" href="js/data/contours.js">
<link rel="modulepreload" href="js/carto-style.js">
<link rel="modulepreload" href="js/theme.js">
<link rel="modulepreload" href="js/ui/player.js">
<link rel="modulepreload" href="js/layers/cameras/index.js">
<link rel="modulepreload" href="js/layers/cameras/load.js">
<link rel="modulepreload" href="js/layers/cameras/player.js">
<link rel="modulepreload" href="js/layers/cameras/marker.js">
</head>
<body>
<div id="app">
<header>
  <div class="titlewrap">
    <h1>Finestres obertes — Càmeres dels Països Catalans</h1>
  </div>
  <div class="header-right">
    <div class="legend" id="legend"></div>
    <button id="theme-toggle" aria-label="Canvia entre mode fosc i mode clar"><span class="knob">
      <svg id="icon-moon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
      <svg id="icon-sun" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </span></button>
  </div>
</header>

<main id="mapwrap"><div id="map"></div><div id="map-attrib">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> © <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a></div></main>

<div id="player">
  <div class="player-card">
    <button class="player-close">✕</button>
    <div class="player-media" id="player-media"></div>
    <div class="player-info">
      <div class="player-name" id="player-name"></div>
      <div class="player-loc" id="player-loc"></div>
      <span class="player-badge" id="player-badge"></span>
    </div>
  </div>
</div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
