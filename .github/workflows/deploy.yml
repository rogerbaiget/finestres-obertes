name: Deploy to Cloudflare Pages

# Matches this project's existing deploy convention: main is pushed freely,
# and prod is fast-forwarded to it as the deliberate "go to production" step.
# The Cloudflare Pages project must be in *direct upload* mode for this to be
# the only thing publishing — its own git-integration build would otherwise
# also try (and fail, since it doesn't know about `npm run build`) on every
# push, racing this workflow.
on:
  push:
    branches: [prod]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Publish to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Project name must match the actual Cloudflare Pages project name
          # exactly — confirm this in the Cloudflare dashboard before the
          # first run. cloudflare/pages-action (previously used here) bundles
          # an unsupported, deprecated Wrangler v2 internally and is stuck
          # declaring a Node 16 runtime with no newer release fixing either —
          # wrangler-action is Cloudflare's actively maintained wrapper
          # around a current Wrangler, so it has neither problem.
          # --commit-dirty=true: dist/ is gitignored build output, so Wrangler's
          # own git-dirty check (unrelated to the Node-version issue above)
          # always sees untracked files here and warns without it.
          command: pages deploy dist --project-name=finestres-obertes --commit-dirty=true

      # wrangler-action, unlike cloudflare/pages-action before it, doesn't write a
      # job summary on its own — reconstruct the same panel from its own outputs.
      # Also surfaces any warning/error lines from the deploy command itself (its
      # command-output/command-stderr outputs), rather than requiring a dig through
      # the raw step log to notice something like the 5-minute Wrangler
      # fallback-install stall that motivated adding this section.
      - name: Deploy summary
        if: always()
        env:
          COMMAND_OUTPUT: ${{ steps.deploy.outputs.command-output }}
          COMMAND_STDERR: ${{ steps.deploy.outputs.command-stderr }}
        run: |
          {
            echo "# Deploying with Cloudflare Pages"
            echo
            echo "| Name | Result |"
            echo "| --- | --- |"
            echo "| **Deployment URL** | ${{ steps.deploy.outputs.deployment-url }} |"
            echo "| **Alias URL** | ${{ steps.deploy.outputs.pages-deployment-alias-url }} |"
            echo
            echo "## Warnings / errors"
            echo
            findings="$(printf '%s\n%s\n' "$COMMAND_OUTPUT" "$COMMAND_STDERR" | grep -iE 'warn|error' || true)"
            if [ -n "$findings" ]; then
              echo '```'
              echo "$findings"
              echo '```'
            else
              echo "None."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
